            data_type: varchar
            description: |
              Gamybinė markė (gamintojo prekės pavadinimas) 
              (kai VALD_TIPAS - "Fizinis" ir MARKE+KOMERCINIS_PAV+SAVIVALDYBE=1,
              tomet vietoje "Gamybinė markė" yra nurodoma "Nuasmeninta",
              atsižvelgiant į asmens duomenų apsaugą)
  
          - name: komercinis_pav
            data_type: varchar
            description: |
              Komercinis pavadinimas (kai VALD_TIPAS - "Fizinis" ir MARKE+KOMERCINIS_PAV+SAVIVALDYBE=1, tomet vietoje "Komercinis pavadinimas" yra nurodoma "Nuasmeninta", atsižvelgiant į asmens duomenų apsaugą)
